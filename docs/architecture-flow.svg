<text x="505" y="872" font-size="11" fill="#55686B" text-anchor="middle" font-style="italic">future: official feeds plug into the same adapter contract, no rebuild</text>
<rect x="40" y="911" width="1520" height="62" rx="10" fill="#FFFFFF" stroke="#D3DDDF"/>
<line x1="64" y1="941" x2="108" y2="941" stroke="#0A6771" stroke-width="2.5"/>
<text x="120" y="945" font-size="13" fill="#0E191B">Live runtime path</text>
