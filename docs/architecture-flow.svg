<path d="M1015 350 H1048" fill="none" stroke="#0A6771" stroke-width="2" marker-end="url(#aTeal)"/>
<text x="1032" y="342" font-size="10" fill="#0A6771" text-anchor="middle" font-style="italic">HTML</text>
