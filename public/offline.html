<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Offline - Lahore Civic Nervous System</title>
  <style>
    :root {
      --bg: #0B1215;
      --text: #E8F0F1;
      --text2: #A6B8BB;
      --accent: #2BB4BF;
    }
    @media (prefers-color-scheme: light) {
      :root {
        --bg: #F4F6F7;
        --text: #0E191B;
        --text2: #45575A;
        --accent: #0D7D86;
      }
    }
    * { box-sizing: border-box; margin: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
      text-align: center;
    }
    .card {
      max-width: 420px;
    }
    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 12px;
      letter-spacing: -0.02em;
    }
    p {
      color: var(--text2);
      font-size: 0.95rem;
      line-height: 1.6;
      margin-bottom: 24px;
    }
    button {
      background: var(--accent);
      color: #fff;
      border: none;
      padding: 10px 24px;
      border-radius: 6px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover { opacity: 0.9; }
    .dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--text2);
      margin-bottom: 16px;
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 1; }
    }
  </style>
</head>
<body>
  <div class="card">
    <span class="dot"></span>
    <h1>You are offline</h1>
    <p>
      The Lahore Civic Nervous System needs an internet connection to fetch
      live air quality and weather data. Cached pages may still be available.
    </p>
    <button onclick="location.reload()">Try again</button>
  </div>
</body>
</html>
